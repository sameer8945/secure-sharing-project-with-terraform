<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureShare</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
        }

        .container {
            width: min(90%, 820px);
            margin: 0 auto;
            padding: 45px 0;
        }

        /* ================= HEADER ================= */

        header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 35px;
        }

        .logo {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
        }

        .logo svg {
            width: 24px;
            height: 24px;
        }

        .brand h1 {
            font-size: 22px;
            font-weight: 600;
        }

        .brand p {
            margin-top: 3px;
            color: #8b949e;
            font-size: 13px;
        }

        /* ================= CARD ================= */

        .card {
            width: 100%;

            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;

            padding: 25px;
            margin-bottom: 18px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 10px;
        }

        .card-header svg {
            width: 20px;
            height: 20px;
            color: #8b949e;
            flex-shrink: 0;
        }

        .card h2 {
            font-size: 17px;
            font-weight: 600;
        }

        .description {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* ================= UPLOAD BOX ================= */

        .file-area {
            width: 100%;
            min-height: 190px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            border: 1px dashed #484f58;
            border-radius: 9px;

            cursor: pointer;

            transition:
                border-color 0.2s,
                background 0.2s;
        }

        .file-area:hover {
            border-color: #58a6ff;
            background: #11161d;
        }

        .file-area input {
            display: none;
        }

        .upload-icon {
            width: 38px;
            height: 38px;

            color: #8b949e;

            margin-bottom: 12px;
        }

        .file-text {
            color: #c9d1d9;
            font-size: 14px;
        }

        .file-name {
            max-width: 90%;

            margin-top: 8px;

            color: #58a6ff;
            font-size: 13px;

            text-align: center;
            word-break: break-word;
        }

        /* ================= BUTTONS ================= */

        button {
            border: none;
            border-radius: 7px;

            padding: 10px 17px;

            font-size: 14px;
            font-weight: 500;

            cursor: pointer;

            transition:
                background 0.15s,
                opacity 0.15s;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .primary {
            background: #238636;
            color: white;

            margin-top: 15px;
        }

        .primary:hover:not(:disabled) {
            background: #2ea043;
        }

        .secondary {
            background: #21262d;
            color: #c9d1d9;

            border: 1px solid #30363d;
        }

        .secondary:hover:not(:disabled) {
            background: #30363d;
        }

        .danger {
            background: #da3633;
            color: white;
        }

        .danger:hover:not(:disabled) {
            background: #f85149;
        }

        /* ================= INPUTS ================= */

        .input-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;

            background: #0d1117;
            color: #e6edf3;

            border: 1px solid #30363d;
            border-radius: 7px;

            padding: 11px 13px;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.15s,
                box-shadow 0.15s;
        }

        input[type="text"]::placeholder {
            color: #6e7681;
        }

        input[type="text"]:focus {
            border-color: #58a6ff;

            box-shadow:
                0 0 0 2px rgba(88, 166, 255, 0.15);
        }

        /* ================= RESULT ================= */

        .result {
            display: none;

            margin-top: 18px;

            padding: 15px;

            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
        }

        .result-title {
            color: #8b949e;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .share-code {
            color: #58a6ff;

            font-size: 24px;
            font-weight: 600;

            letter-spacing: 3px;
        }

        .message {
            margin-top: 8px;

            font-size: 13px;
            color: #8b949e;
        }

        .success {
            color: #3fb950;
        }

        .error {
            color: #f85149;
        }

        /* ================= FOOTER ================= */

        footer {
            text-align: center;

            color: #6e7681;
            font-size: 12px;

            margin-top: 30px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .container {
                width: 94%;
                padding: 25px 0;
            }

            .card {
                padding: 20px;
            }

            .input-row {
                flex-direction: column;
            }

            .input-row button {
                width: 100%;
            }

            .file-area {
                min-height: 170px;
            }
        }
    </style>
</head>


<body>

<div class="container">

    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M12 3v12"></path>
                <path d="m7 8 5-5 5 5"></path>
                <path d="M5 14v4a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-4"></path>
            </svg>

        </div>

        <div class="brand">

            <h1>SecureShare</h1>

            <p>
                Simple. Private. File sharing.
            </p>

        </div>

    </header>


    <!-- ================= UPLOAD ================= -->

    <div class="card">

        <div class="card-header">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M12 16V4"></path>
                <path d="m7 9 5-5 5 5"></path>
                <path d="M5 20h14"></path>
            </svg>

            <h2>Upload a file</h2>

        </div>


        <p class="description">
            Upload a small file and generate a share code.
        </p>


        <label class="file-area">

            <input
                type="file"
                id="fileInput"
            >


            <svg
                class="upload-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M12 16V4"></path>
                <path d="m7 9 5-5 5 5"></path>
                <path d="M5 20h14"></path>
            </svg>


            <div class="file-text">
                Click to choose a file
            </div>


            <div
                class="file-name"
                id="fileName"
            >
                No file selected
            </div>

        </label>


        <button
            class="primary"
            id="uploadButton"
        >
            Upload file
        </button>


        <div
            class="result"
            id="uploadResult"
        >

            <div class="result-title">
                Your share code
            </div>


            <div
                class="share-code"
                id="shareCode"
            >
                ------
            </div>


            <div
                class="message"
                id="uploadMessage"
            ></div>

        </div>

    </div>


    <!-- ================= DOWNLOAD ================= -->

    <div class="card">

        <div class="card-header">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M12 4v12"></path>
                <path d="m7 11 5 5 5-5"></path>
                <path d="M5 20h14"></path>
            </svg>

            <h2>Download a file</h2>

        </div>


        <p class="description">
            Enter a share code to download your file.
        </p>


        <div class="input-row">

            <input
                type="text"
                id="downloadCode"
                placeholder="Enter share code"
                maxlength="6"
            >


            <button
                class="secondary"
                id="downloadButton"
            >
                Download
            </button>

        </div>


        <div
            class="message"
            id="downloadMessage"
        ></div>

    </div>


    <!-- ================= DELETE ================= -->

    <div class="card">

        <div class="card-header">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M4 7h16"></path>
                <path d="M10 11v6"></path>
                <path d="M14 11v6"></path>
                <path d="M6 7l1 13h10l1-13"></path>
                <path d="M9 7V4h6v3"></path>
            </svg>

            <h2>Delete a file</h2>

        </div>


        <p class="description">
            Delete a file using its share code.
        </p>


        <div class="input-row">

            <input
                type="text"
                id="deleteCode"
                placeholder="Enter share code"
                maxlength="6"
            >


            <button
                class="danger"
                id="deleteButton"
            >
                Delete
            </button>

        </div>


        <div
            class="message"
            id="deleteMessage"
        ></div>

    </div>


    <footer>
        SecureShare · AWS serverless file sharing
    </footer>

</div>


<script>

    /* ================= API ================= */

    const API_URL =
        "https://9kg80v7lc7.execute-api.ap-south-1.amazonaws.com";


    /* ================= FILE SELECTION ================= */

    const fileInput =
        document.getElementById("fileInput");

    const fileName =
        document.getElementById("fileName");


    fileInput.addEventListener("change", () => {

        if (fileInput.files.length > 0) {

            fileName.textContent =
                fileInput.files[0].name;

        } else {

            fileName.textContent =
                "No file selected";

        }

    });


    /* ================= FILE → BASE64 ================= */

    function fileToBase64(file) {

        return new Promise((resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload = () => {

                const result =
                    reader.result;

                const base64 =
                    result.split(",")[1];

                resolve(base64);

            };


            reader.onerror =
                reject;


            reader.readAsDataURL(file);

        });

    }


    /* ================= UPLOAD ================= */

    const uploadButton =
        document.getElementById("uploadButton");

    const uploadResult =
        document.getElementById("uploadResult");

    const shareCode =
        document.getElementById("shareCode");

    const uploadMessage =
        document.getElementById("uploadMessage");


    uploadButton.addEventListener(
        "click",
        async () => {

            const file =
                fileInput.files[0];


            if (!file) {

                uploadResult.style.display =
                    "block";

                shareCode.textContent =
                    "------";

                uploadMessage.textContent =
                    "Please choose a file first.";

                uploadMessage.className =
                    "message error";

                return;
            }


            try {

                uploadButton.disabled =
                    true;

                uploadButton.textContent =
                    "Uploading...";


                const base64Data =
                    await fileToBase64(file);


                const response =
                    await fetch(
                        `${API_URL}/upload?filename=${encodeURIComponent(file.name)}`,
                        {
                            method: "POST",
                            body: base64Data
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Upload failed"
                    );

                }


                uploadResult.style.display =
                    "block";


                shareCode.textContent =
                    data.share_code;


                uploadMessage.textContent =
                    "File uploaded successfully.";


                uploadMessage.className =
                    "message success";


            } catch (error) {

                uploadResult.style.display =
                    "block";


                shareCode.textContent =
                    "------";


                uploadMessage.textContent =
                    error.message;


                uploadMessage.className =
                    "message error";

            } finally {

                uploadButton.disabled =
                    false;

                uploadButton.textContent =
                    "Upload file";

            }

        }
    );


    /* ================= DOWNLOAD ================= */

const downloadButton =
    document.getElementById("downloadButton");

const downloadCode =
    document.getElementById("downloadCode");

const downloadMessage =
    document.getElementById("downloadMessage");


downloadButton.addEventListener(
    "click",
    async () => {

        const code =
            downloadCode.value
                .trim()
                .toUpperCase();


        if (!code) {

            downloadMessage.textContent =
                "Enter a share code.";

            downloadMessage.className =
                "message error";

            return;
        }


        try {

            downloadButton.disabled = true;

            downloadButton.textContent =
                "Downloading...";


            const response =
                await fetch(
                    `${API_URL}/download/${encodeURIComponent(code)}`
                );


            if (!response.ok) {

                let message = "Download failed";

                try {
                    const data =
                        await response.json();

                    message =
                        data.message || message;

                } catch {
                    // Response was not JSON
                }

                throw new Error(message);
            }


            /* Get the actual file data */

            const fileData =
                await response.arrayBuffer();


            /* Create a downloadable file */

            const blob =
                new Blob(
                    [fileData],
                    {
                        type:
                            response.headers.get("Content-Type")
                            || "application/octet-stream"
                    }
                );


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href = url;

            link.download = "download";


            document.body.appendChild(link);

            link.click();

            link.remove();


            URL.revokeObjectURL(url);


            downloadMessage.textContent =
                "Download started.";

            downloadMessage.className =
                "message success";


        } catch (error) {

            downloadMessage.textContent =
                error.message;

            downloadMessage.className =
                "message error";

        } finally {

            downloadButton.disabled = false;

            downloadButton.textContent =
                "Download";

        }

    }
);

   


    /* ================= DELETE ================= */

    const deleteButton =
        document.getElementById("deleteButton");

    const deleteCode =
        document.getElementById("deleteCode");

    const deleteMessage =
        document.getElementById("deleteMessage");


    deleteButton.addEventListener(
        "click",
        async () => {

            const code =
                deleteCode.value
                    .trim()
                    .toUpperCase();


            if (!code) {

                deleteMessage.textContent =
                    "Enter a share code.";

                deleteMessage.className =
                    "message error";

                return;
            }


            const confirmed =
                confirm(
                    "Are you sure you want to delete this file?"
                );


            if (!confirmed) {
                return;
            }


            try {

                deleteButton.disabled =
                    true;

                deleteButton.textContent =
                    "Deleting...";


                const response =
                    await fetch(
                        `${API_URL}/delete/${encodeURIComponent(code)}`,
                        {
                            method: "DELETE"
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Delete failed"
                    );

                }


                deleteMessage.textContent =
                    "File deleted successfully.";

                deleteMessage.className =
                    "message success";


            } catch (error) {

                deleteMessage.textContent =
                    error.message;

                deleteMessage.className =
                    "message error";


            } finally {

                deleteButton.disabled =
                    false;

                deleteButton.textContent =
                    "Delete";

            }

        }
    );

</script>

</body>
</html>
